[workspace]
members = ["core", "core/macros", "style", "style/macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/successalexbedi/chain_ui_rs"

[workspace.dependencies]
owo-colors = "4"
tokio = { version = "1", features = ["full"] }
textwrap = { version = "0.16", features = ["terminal_size"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chain_ui_core = { path = "core", version = "0.1.0" }
chain_ui_macros = { path = "core/macros", version = "0.1.0" }
chain_ui = { path = "style", version = "0.1.0" }
chain_ui_style_macros = { path = "style/macros", version = "0.1.0" }
